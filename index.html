<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal do Estudante — Indústria Criativa · Ulbra</title>
<meta name="description" content="Portal do Estudante da Indústria Criativa: Design Digital, Marketing, Mídias Sociais Digitais e Jornalismo. Contatos, calendário acadêmico, agendamento e plantão de atendimento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-900: #0d3634;
    --green-800: #034948;
    --green-600: #045a52;
    --gold-100: #f5ce99;
    --gold-300: #cca269;
    --gold-700: #66563d;
    --text: #1a1a1a;
    --text-muted: #606060;
    --line-hairline: #e3e3e3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
  }

  a {
    color: var(--green-600);
  }

  a:hover {
    color: var(--green-800);
  }

  .topnav {
    background: var(--green-900);
    padding: 14px 32px;
  }

  .topnav-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px 24px;
    flex-wrap: wrap;
  }

  .topnav-brand {
    font-size: 14px;
    font-weight: 600;
    color: var(--gold-100);
    text-decoration: none;
  }

  .topnav-links {
    display: flex;
    gap: 24px;
  }

  .topnav-links a {
    font-size: 14px;
    font-weight: 600;
    color: #c6ddd0;
    text-decoration: none;
  }

  .topnav-links a:hover,
  .topnav-links a.active {
    color: var(--gold-100);
  }

  .hero {
    position: relative;
    background: var(--green-900);
  }

  .hero-banner {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero-logo {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hero-logo img {
    height: 20px;
  }

  .hero-logo span {
    font-size: 19px;
    font-weight: 700;
    color: var(--gold-100);
  }

  .icon-menu {
    max-width: 1080px;
    margin: 0 auto;
    padding: 48px 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
  }

  .icon-card {
    display: block;
    width: 180px;
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    transition: transform .2s ease;
  }

  .icon-card:hover {
    transform: translateY(-4px);
  }

  .icon-card img {
    display: block;
    width: 100%;
    height: auto;
  }

  .icon-card--disabled {
    opacity: .5;
    cursor: default;
  }

  .icon-card--disabled:hover {
    transform: none;
  }

  footer {
    border-top: 1px solid var(--line-hairline);
    margin-top: 24px;
  }

  .footer-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 32px 48px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 32px;
    justify-content: space-between;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-brand" href="index.html">Portal do Estudante · Indústria Criativa</a>
    <div class="topnav-links">
      <a class="active" href="index.html">Início</a>
      <a href="calendario-ead.html">Calendário</a>
      <a href="contatos.html">Contatos</a>
    </div>
  </div>
</nav>

<div class="hero">
  <div class="hero-logo">
    <img src="assets/mark-rose-gold.png" alt="">
    <span>ulbra</span>
  </div>
  <img class="hero-banner" src="assets/banner-portal-estudante-1600x420.png" alt="Portal do Estudante — Design Digital, Marketing, Mídias Sociais Digitais, Jornalismo — Universidade Luterana do Brasil">
</div>

<section class="icon-menu">
  <a class="icon-card" href="contatos.html#plantao">
    <img src="assets/icone-plantao-atendimento.png" alt="Plantão de Atendimento">
  </a>
  <a class="icon-card" href="contatos.html">
    <img src="assets/icone-contatos.png" alt="Contatos">
  </a>
  <a class="icon-card" href="contatos.html#pessoalmente">
    <img src="assets/icone-agendamento.png" alt="Agendamento">
  </a>
  <a class="icon-card" href="calendario-ead.html">
    <img src="assets/icone-calendario.png" alt="Calendário">
  </a>
  <span class="icon-card icon-card--disabled">
    <img src="assets/icone-labex.png" alt="LabEx (em breve)">
  </span>
</section>

<footer>
  <div class="footer-inner">
    <span>ULBRA · Universidade Luterana do Brasil · Campus Canoas · Mantida pela AELBRA</span>
    <span>ulbra.br</span>
  </div>
</footer>

</body>
</html>
